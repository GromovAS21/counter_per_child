{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кто же будет? Мальчик или девочка</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/googleapis.css' %}" rel="stylesheet">
    <link href="{% static 'css/gender_prediction.css' %}" rel="stylesheet">
    <link href="{% static 'css/gender_form.css' %}" rel="stylesheet">
    <link href="{% static 'css/header_main_btn.css' %}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
<!-- Фоновая анимация элементов -->
<div id="floating-elements"></div>

<!-- Меню -->
<div class="menu-container">
    <button class="menu-btn" id="menuBtn">
        <span class="menu-line"></span>
        <span class="menu-line"></span>
        <span class="menu-line"></span>
    </button>

    <div class="menu-dropdown" id="menuDropdown">
        <a href="/" class="menu-user-link">
            <div class="menu-user">
                <img src="/media/default-avatar.png/" alt="Аватар" class="user-avatar">
                <div class="user-name">{{ user.username }}</div>
            </div>
        </a>

        <a href="/" class="menu-item-link">
            <div class="menu-item">
                <i class="fas fa-sliders-h"></i>
                <span>Настройка карточек</span>
            </div>
        </a>

        <a href="/" class="menu-item-link">
            <div class="menu-item logout">
                <i class="fas fa-sign-out-alt"></i>
                <span>Выход</span>
            </div>
        </a>
    </div>
</div>

{% block content %}
{% endblock %}

{% include 'footer.html' %}

<script src="{% static 'js/bundle.min.js' %}"></script>
<script src="{% static 'js/color-modes.js' %}"></script>
<script src="{% static 'js/gender_prediction.js' %}"></script>
<script src="{% static 'js/websocket.js' %}"></script>
<script src="{% static 'js/header_main_btn.js' %}"></script>
</body>
</html>
