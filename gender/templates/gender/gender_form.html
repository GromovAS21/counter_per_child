{% load static %}
<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Обновить запись</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/gender_prediction.css' %}" rel="stylesheet">
    <style>
        /* Основные стили для центрирования */
        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        /* Стили для группы формы */
        .form-group {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 1.5rem;
        }

        /* Стили для поля ввода */
        .form-control {
            text-align: center;
            font-size: 1.2rem;
            padding: 12px 20px;
            border-radius: 50px;
            border: 2px solid rgba(0,0,0,0.1);
        }

        /* Стили для метки */
        .form-label {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            display: block;
            font-weight: bold;
            color: #333;
        }

        /* Контейнер для кнопок */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-top: 2rem;
        }

        /* Общие стили для кнопок */
        .btn {
            border-radius: 50px;
            padding: 12px 35px;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        /* Стили для кнопки Обновить (голубые оттенки для мальчика) */
        .btn-boy {
            background: linear-gradient(135deg, #64b5f6 0%, #a1c4fd 50%, #4facfe 100%);
            background-size: 200% auto;
            color: white;
            animation: gradientBlue 8s ease infinite;
        }

        /* Стили для кнопки Обновить (розовые оттенки для девочки) */
        .btn-girl {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #f06292 100%);
            background-size: 200% auto;
            color: white;
            animation: gradientPink 8s ease infinite;
        }

        /* Стили для кнопки Отмена (голубая рамка для мальчика) */
        .btn-cancel-boy {
            background: white;
            color: #2196f3;
            border-color: #2196f3;
        }

        /* Стили для кнопки Отмена (розовая рамка для девочки) */
        .btn-cancel-girl {
            background: white;
            color: #e91e63;
            border-color: #e91e63;
        }

        /* Анимации */
        @keyframes colorBlue {
            0% { color: #2196f3; }
            50% { color: #64b5f6; }
            100% { color: #2196f3; }
        }

        @keyframes colorPink {
            0% { color: #e91e63; }
            50% { color: #ff80ab; }
            100% { color: #e91e63; }
        }

        @keyframes gradientBlue {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes gradientPink {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Заголовок формы */
        .form-title {
            font-family: 'Pacifico', cursive;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* Цвета заголовка в зависимости от пола */
        .form-title-boy {
            animation: colorBlue 8s infinite;
        }

        .form-title-girl {
            animation: colorPink 8s infinite;
        }

        /* Эффекты при наведении */
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .btn-boy:hover, .btn-girl:hover {
            color: white;
        }

        .btn-cancel-boy:hover {
            background: #f8f9fa;
            color: #2196f3;
        }

        .btn-cancel-girl:hover {
            background: #f8f9fa;
            color: #e91e63;
        }
    </style>
</head>

<body>
<!-- Фоновая анимация элементов -->
<div id="floating-elements"></div>

<div class="container centered-container">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card form-card mb-4 box-shadow">
                <div class="card-body p-4 p-md-5 form-container">
                    <h2 class="form-title {% if object.name == 'Мальчик' %}form-title-boy{% else %}form-title-girl{% endif %}">
                        {% if object.name == "Мальчик" %}
                        Обновить сумму мальчика
                        {% else %}
                        Обновить сумму девочки
                        {% endif %}
                    </h2>

                    <form method="post" enctype="multipart/form-data" class="w-100">
                        {% csrf_token %}

                        <!-- Поле для суммы -->
                        <div class="form-group">
                            <input type="number" name="{{ form.total.name }}" id="{{ form.total.id_for_label }}"
                                   class="form-control" placeholder="Введите общую сумму"
                                   value="{{ form.total.value|default_if_none:'' }}">
                            {% if form.total.errors %}
                                <div class="text-danger mt-2">
                                    {{ form.total.errors }}
                                </div>
                            {% endif %}
                        </div>

                        <div class="button-container">
                            <button type="submit" class="btn {% if object.name == 'Мальчик' %}btn-boy{% else %}btn-girl{% endif %}">
                                Обновить
                            </button>
                            <a class="btn {% if object.name == 'Мальчик' %}btn-cancel-boy{% else %}btn-cancel-girl{% endif %}"
                               href="{% url 'gender:home_page' %}"
                               role="button">
                                Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="py-4">
    <div class="container text-center">
        <small class="text-muted" style="font-size: 1rem;">GromovAS &copy; С любовью😘 2025 </small>
    </div>
</footer>

<script src="{% static 'js/gender_prediction.js' %}"></script>
</body>
</html>
