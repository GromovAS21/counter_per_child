server {
    server_name ktozhebudet.ru;

    client_max_body_size 10M;

    location /media/ {
        root /etc/counter_per_child;
        expires 30d;
    }

    location /static/ {
        alias /etc/counter_per_child/staticfiles;
        expires 30d;
    }

    location = / {
        return 301 /gender-cards/;
    }

    location /ws/gender-updates/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;

        proxy_connect_timeout 75s;
        proxy_read_timeout 300s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ktozhebudet.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ktozhebudet.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

}
server {
    if ($host = ktozhebudet.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name ktozhebudet.ru;
    return 404;