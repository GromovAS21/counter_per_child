services:
  db:
    container_name: cpc_db
    image: postgres:latest
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - 5432
    volumes:
      - cpc:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', '-c', 'pg_isready -U $POSTGRES_USER -d $POSTGRES_DB' ]
      interval: 5s
      retries: 5
      timeout: 10s
    networks:
      - cpc

  app:
    container_name: cpc_app
    build: .
    tty: true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - ./static_collected:/app/static_collected
      - ./media:/app/media
    env_file:
      - .env
    command: >
      sh -c 'python manage.py migrate &&
             python manage.py collectstatic --no-input &&
             python manage.py csu &&
             python manage.py runserver 0.0.0.0:${APP_PORT}'
    networks:
      - cpc

  redis:
    container_name: cpc_redis
    image: redis
    restart: unless-stopped
    expose:
      - 6379
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cpc
    volumes:
      - redis_data:/data

volumes:
  cpc:
  redis_data:

networks:
  cpc:
